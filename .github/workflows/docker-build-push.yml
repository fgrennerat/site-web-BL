name: Build & push Docker image to GitLab Registry

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  GITLAB_IMAGE: registry.gitlab.com/grensf/site-web-BL

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Connexion au registre GitLab
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GITLAB_IMAGE }}:latest
            ${{ env.GITLAB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
