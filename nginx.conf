server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploads admin : une requête par fichier (voir AdminPage.jsx), donc la
    # limite ici n'a besoin de couvrir qu'un seul fichier à la fois — voir
    # MAX_FILE_SIZE dans server/lib/resources.mjs.
    client_max_body_size 55m;

    # API d'administration des ressources (Node, dans le même conteneur).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers de ressources (documents/vidéos uploadés), servis par le
    # même process Node depuis le volume /data/resources.
    location /resources/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Site à page unique (routage côté client) : toute route inconnue
    # retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques : cache long, immuables (noms hachés par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
